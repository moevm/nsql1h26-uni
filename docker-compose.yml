services:
  db:
    image: mongo:6.0
    container_name: mongodb_university
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  db-init:
    build:
      context: ./backend
    container_name: db_init
    depends_on:
      - db
    environment:
      - DATABASE_TYPE=mongodb
      - DATABASE_HOST=mongodb
      - DATABASE_PORT=27017
      - DATABASE_NAME=university_db
    networks:
      - app-network
    command: sh -c "sleep 5 && python init_collections.py"
    restart: "no"

  fastapi-app:
    build:
      context: ./backend
    container_name: fastapi_app
    restart: unless-stopped
    depends_on:
      - db
      - db-init
    ports:
      - "8080:8000"
    environment:
      - DATABASE_TYPE=mongodb
      - DATABASE_HOST=mongodb
      - DATABASE_PORT=27017
      - DATABASE_NAME=university_db
    networks:
      - app-network
    command: sh -c "sleep 5 && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: frontend_app
    restart: unless-stopped
    depends_on:
      - fastapi-app
    ports:
      - "3000:80"
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge